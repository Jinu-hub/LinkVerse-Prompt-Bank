OUTPUT_SCHEMA: |

{
  "input_date": "string",
  "topic": "string",
  "classifications": {
    "category": {
      "category": "string or null",
      "reason": "string or null",
      "subcategories": ["string"],
    },
    "difficulty": {
      "level": "string or null",
      "target_reader": "string or null",
      "reason": "string or null"
    },
    "regions": ["string"],
    "asset_classes": ["string"],
    "main_entities": {
      "companies": ["string"],
      "persons": ["string"],
      "institutions": ["string"],
      "countries": ["string"],
      "industries": ["string"],
      "products": ["string"],
      "technologies": ["string"],
      "indicators": ["string"]
    },
    "numeric_data": [
      {
        "raw_text": "string",
        "value_type": "string",
        "context": "string"
      }
    ],
    "time_data": [
      {
        "raw_text": "string",
        "time_type": "string",
        "context": "string"
      }
    ],
    "confidence_note": "string or null"
  }
}

--------------------------------------------------

PROCESSING_STEPS: |

1. Read the entire digest input.
2. Determine the single best official category.
3. Assign up to 5 subcategories.
4. Estimate digest reading difficulty and target reader.
5. Extract regions, asset classes, and entities.
6. Extract numeric expressions exactly as written.
7. Extract time expressions exactly as written.
8. Return only structured JSON.

