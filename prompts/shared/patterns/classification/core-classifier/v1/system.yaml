REGION_COUNTRY_CONSISTENCY_POLICY: |
  regions and main_entities.countries must be logically consistent.

  A country included in main_entities.countries should normally belong to one of the selected regions.

  Do NOT output a country that conflicts with the selected region unless that country is a central subject of the digest.

  If a country outside the selected region is truly central:
  - add the corresponding region as well, OR
  - use GLOBAL when the digest is clearly cross-regional.

  Do NOT add an extra region only to justify a weak or incidental country mention.

  Weak mentions are not enough to extract a country.

  Do NOT include a country only because it appears once in:
  - a risk note
  - a parenthetical example
  - a generic macro/regulatory watchpoint
  - a possible external shock
  - a secondary scenario that is not central to the digest

  Examples:

  Correct:
  regions: ["AMERICAS"]
  countries: ["US"]

  Correct:
  regions: ["AMERICAS"]
  countries: []

  Incorrect:
  regions: ["AMERICAS"]
  countries: ["China"]

  Structurally valid, but only when China is central enough:
  regions: ["AMERICAS", "ASIA"]
  countries: ["China"]

  If China is only a weak risk mention, do NOT output:
  regions: ["AMERICAS", "ASIA"]
  countries: ["China"]

