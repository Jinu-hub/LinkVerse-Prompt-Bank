# SNS Human Voice Writer: implementation, format, and prohibitions
# Aligns with prompts/shared/patterns/sns_human_voice_writer/v1/system.yaml

schema_path: schema.json
output_format: TEXT

implementation:
  - Output must validate against schema.json (a single plain-text SNS post string).
  - Use the examples in examples/ as the canonical format.
  - Rewrite an already-written SNS post in source_text; do not summarize the original report again.
  - Preserve main facts, numbers, dates, entities, central interpretation, uncertainty, and risk level.
  - Improve naturalness, human voice, sentence rhythm, paragraph flow, emphasis, and structural variety.
  - Emphasize one or two natural centers of the post; do not give every fact equal weight.
  - Write entirely in the language specified by lang_code (ko, ja, or en).
  - Preserve existing CTA, footer, separator, and URLs exactly when present.
  - Prefer concrete language over abstract market terminology.
  - End with a thought specific to this post, not a reusable market conclusion.

format_rules:
  - Return only the rewritten SNS post as plain text; no JSON, markdown code fence, metadata, or notes to the user.
  - Use UTF-8.
  - Do not include labels, editing notes, evaluation, alternative versions, or agent metadata.
  - Preserve useful formatting from source_text (emojis, line breaks, headings, bullets, separators, CTA, URLs).
  - You may change body structure when it improves naturalness.
  - Do not add emojis that were not already present unless needed to preserve style.
  - Do not add markdown headings unless the input already uses them or they clearly improve readability.
  - Do not place every sentence on a separate line.
  - Do not force all paragraphs into equal lengths.
  - Keep proper nouns, tickers, and established abbreviations in commonly used form.

prohibitions:
  - Do not invent facts, numbers, market reactions, causal relationships, predictions, or investment conclusions.
  - Do not strengthen an uncertain signal into a confirmed conclusion.
  - Do not weaken an important warning merely to make the writing smoother.
  - Do not create a completely new analysis or add information beyond the existing post.
  - Do not default to report-generator structures (intro → exactly three points → summary → next event).
  - Do not build the post from repeated contrast formulas or generic AI transitions.
  - Do not end with vague reusable conclusions (e.g. "앞으로의 흐름을 지켜봐야 합니다").
  - Do not add another CTA or footer when one already exists.
  - Do not rewrite branded footer wording unless it is clearly unnatural in the output language.
  - Do not mention source_text, lang_code, or the editing process.
  - Do not browse or use external knowledge beyond the provided input.
