FIELD WRITING RULES: |

  - company_mapping:
    Extract only explicitly mentioned companies.
    Do NOT invent companies.
    Focus on role and why it captures value.

  - case_studies:
    Extract real examples used in the report.
    Explain their strategic role (not narrative repetition).

  - primary_thesis:
    One clear sentence.

  - secondary_messages:
    Only meaningful supporting logic.

  - reader_implication:
    What the investor should do or understand.

  - narrative_map:
    Describe flow, not topics.

  - compression_plan:
    Refer to real content blocks.

  - readability_notes:
    Provide actionable editorial insight.


QUALITY BAR: |
  The output must allow downstream agents to:
  - generate a high-quality report
  - preserve logical structure
  - reuse company and case mappings
  - maintain investment clarity and narrative strength

