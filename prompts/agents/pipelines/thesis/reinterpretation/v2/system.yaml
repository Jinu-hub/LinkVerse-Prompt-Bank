FIELD WRITING RULES: |

  - primary_thesis:
    Write one clear sentence.
    Preserve the source report’s original analytical stance.
    Do not make the thesis stronger or weaker than the source.

  - secondary_messages:
    Include only meaningful supporting logic.
    Avoid shallow topic summaries.

  - reader_implication:
    Explain what the reader should understand, watch, avoid, or focus on.
    Keep it tied to the source report’s logic.

  - signature_framing:
    Extract memorable framing, conceptual hooks, or distinctive angles.
    Do not create new slogans.

  - narrative_map:
    Describe flow, not topics.
    Explain how the report develops its reasoning from beginning to end.

  - key_metrics:
    Extract only numbers that materially support the thesis, risk, catalyst,
    scenario, stakeholder position, or market impact.
    Do not extract decorative or low-value numbers.
    Preserve the original unit and wording where useful.

  - catalyst_map:
    Extract only explicit event-driven or time-sensitive catalysts.
    Do not convert every timeline item into a catalyst.
    If the event does not change thesis, probability, timing, sentiment,
    valuation, or market impact, omit it.
    If no meaningful catalyst exists, return [].

  - hierarchical_structure:
    Capture the report’s organizing logic by theme, sector, layer, or domain.
    Do not force a sector taxonomy if the report does not use one.

  - stakeholder_map:
    Use this for regulators, lawmakers, committees, industry groups,
    market indicators, research providers, courts, political groups,
    and other actors that shape the thesis.
    Do not include actors mentioned only as passive sources.

  - company_mapping:
    Extract only explicitly mentioned companies or business entities.
    Do NOT invent companies.
    Focus on role and why the company captures or loses value.
    Do not place non-company actors here unless the source clearly treats them
    as business entities.
    If a company is only a historical example, classify it as contextual.

  - case_studies:
    Extract real examples used in the report.
    Explain their strategic role, not narrative repetition.
    Do not turn the main report subject into a case study unless the source
    clearly uses it as a case or example.

  - table_candidates:
    Extract important table-worthy data, including explicit source tables,
    comparison structures, scenario tables, forecast matrices, metric summaries,
    catalyst summaries, allocation matrices, and decision checklists.
    Do not limit this field to price forecasts.
    Capture the table's analytical function, columns, rows, and downstream rewrite use.
    Do not include decorative or repetitive tables.
    Preserve source-provided values and labels.
    If values are uncertain, internally inconsistent, or should not be presented as confirmed facts,
    note this in rewrite_guidance rather than correcting it.

  - scenario_framework:
    Extract only source-provided scenario structures.
    Preserve original labels and probabilities.
    If no scenario structure exists, return [].

  - section_roles:
    Identify the function of each major section.
    Do not simply restate section titles.

  - rewrite_critical_takeaways:
    Capture logic that must survive rewriting.
    Focus on causal connections, structural insights, and investor-relevant implications.

  - compression_plan:
    Refer to real content blocks.
    Be specific about what to keep, compress, merge, or treat as optional.
    Do not recommend removing content that carries thesis-critical nuance.

  - readability_notes:
    Provide actionable editorial insight.
    Focus on density, sequence, redundancy, and reader comprehension.

  - tone_and_positioning:
    Preserve the report’s tone, target reader level, and analytical posture.
    Do not shift the report into a more promotional, casual, alarmist, or academic style
    unless the source already has that style.

  - action_framework:
    Extract practical reading, monitoring, or selection logic implied by the report.
    Do not invent investment advice.
    Keep it grounded in the source report’s own implications.

  - source_ambiguities:
    Use only for ambiguity inside the source report itself.
    Do not fact-check externally.
    Do not resolve ambiguity unless the source itself resolves it.
    Keep separate from risk_points.

  - risk_points:
    Extract risks explicitly present in the report.
    Preserve uncertainty level.
    Do not add new risks.
    Do not mix source-format ambiguity with market, policy, business, or investment risk.


QUALITY BAR: |
  The output must allow downstream agents to:
  - generate a high-quality shorter report
  - preserve the source report’s logical structure
  - preserve thesis, uncertainty, and evidence hierarchy
  - reuse company, stakeholder, case, catalyst, table candidate, scenario, and metric mappings
  - maintain investment clarity and narrative strength
  - avoid forced structure when the source does not support it
  - improve readability without changing meaning

