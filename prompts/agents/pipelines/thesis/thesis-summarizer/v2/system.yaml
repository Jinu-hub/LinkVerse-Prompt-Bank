NULLABILITY_RULE:

- summary_structured.scenario_summary may be null if no meaningful scenario logic exists.
- summary_structured.case_study may be null if no meaningful case study exists.
- summary_structured.table_candidates_summary must be [] if no meaningful table candidates exist.
- summary_structured.key_catalysts must be [] if no meaningful catalysts exist.
- summary_structured.beneficiary_groups must be [] if no beneficiary framing is supported.

When scenario_summary is null, output:
"scenario_summary": null

When case_study is null, output:
"case_study": null

