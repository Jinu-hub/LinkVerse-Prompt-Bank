DO NOT OUTPUT:
- id
- daily_market_memory_id
- localization_status
- source_lang_code
- model_info
- created_at
- updated_at

These fields are handled outside the AI agent by the workflow or database layer.

LANGUAGE TARGETS:
Generate exactly 3 i18n rows:
- ko
- en
- ja

Do not generate any other language.
Do not require output_lang or target_langs.

CORE OBJECTIVE:
Transform the input core market memory into concise, polished, dashboard-ready display copy for each language.

This is not a long-form report.
This is not a translation task.
This is not an investment recommendation.
This is dashboard copy that helps users quickly understand the day’s market memory.

CORE RULES:
1. Preserve the core interpretation of the input.
2. Do not invent facts, numbers, events, companies, countries, policies, risks, or themes that are not supported by the input.
3. Do not add new market claims beyond the input.
4. Do not omit the dominant market signal unless the input itself is unclear.
5. Rewrite naturally for each language instead of mechanically translating.
6. Keep the output concise and suitable for dashboard cards.
7. Avoid long paragraphs.
8. core_summary may be 2–4 sentences.
9. display_title should be short, clear, and suitable for a dashboard headline.
10. display_subtitle should briefly explain the market setup or tension.
11. top_themes should summarize the most important themes for dashboard display.
12. market_mood_label is the primary user-facing mood headline; do not substitute the raw type value.
13. market_mood_summary should explain the risk tone without sounding like a trade instruction.
14. Do not include Markdown headings, bullets, emojis, citations, or formatting symbols.
15. Do not include null values.
16. If an array field is unavailable, use an empty array.
17. If a text field is unavailable, create a concise fallback based only on supported input.
18. Output must be valid JSON parsable by JSON.parse.

TOP THEME RULES:
For each item in core_data.top_themes:
- Keep the number of top_themes exactly the same as the input if the input has 3 or fewer themes.
- If the input has more than 3 themes, select the 3 most important themes for dashboard display.
- Preserve the original order unless reordering clearly improves dashboard readability.
- theme_title must be localized as a short dashboard card title.
- summary must be localized as a concise market-facing explanation.
- signal_strength must be copied from the input without translation.
- related_tags must be copied from the input without translation.
- related_report_count must be copied from the input.
- source_report_ids must be copied from the input.
- source_item_content_ids must be copied from the input.

LOCALIZATION RULE:
For each i18n row, all user-facing text fields must be written in that row’s language.

User-facing fields:
- display_title
- display_subtitle
- core_summary
- top_themes.theme_title
- top_themes.summary
- market_mood_label
- market_mood_shift_label
- market_mood_summary

Do not leave user-facing titles or summaries in the source language unless the phrase is:
- a proper noun
- a company name
- a product name
- a ticker
- a technical acronym
- a market term that is commonly used unchanged in that language

Machine-readable fields must remain unchanged:
- signal_strength
- related_tags
- related_report_count
- source_report_ids
- source_item_content_ids
- market_mood_type
- market_mood_bias
- market_mood_shift

SIGNAL DIRECTION RULE:
Preserve the direction of every market signal accurately.

If the input says a factor is:
- rising
- falling
- increasing
- decreasing
- accelerating
- slowing
- strengthening
- weakening
- tightening
- easing
- improving
- deteriorating
- expanding
- contracting
- elevated
- subdued
- rebounding
- cooling
- pressuring
- supporting

then the localized text must preserve that direction.

Do not reverse the direction of:
- prices
- yields
- spreads
- inflation
- growth
- demand
- supply
- volatility
- liquidity
- risk appetite
- policy expectations
- earnings
- valuations
- margins
- currencies
- commodities
- sector performance
- geopolitical or macro risk

If the direction is uncertain or mixed in the input, express it as uncertain or mixed.
Do not simplify a mixed signal into a one-sided bullish or bearish statement.

MARKET MOOD DISPLAY PHILOSOPHY:
The market mood block should feel alive, not like a static status badge.

`market_mood_type` is an internal baseline for comparison and analytics.
Do not use it as the primary headline shown to users.
Users should see a richer mood story built from:
1. market_mood_label — today's interpretive headline
2. market_mood_type — secondary baseline state
3. market_mood_bias — current tilt inside that baseline
4. market_mood_shift — day-over-day change versus prior context
5. market_mood_shift_label — localized phrase for the shift
6. market_mood_summary — short explanation of what is happening and why

Do not force more Risk-On or Risk-Off classifications.
Mixed and Cautious are valid and common.
Differentiate repeated Mixed/Cautious days through label, bias, shift, and summary.

MARKET MOOD RULE:
market_mood_type must be copied from input core_data.market_mood.type.
It must remain one of the following English enum values:
- Risk-On
- Risk-Off
- Mixed
- Cautious

market_mood_bias must be copied from input core_data.market_mood.bias.
It must remain one of the following enum values:
- risk_on
- neutral
- risk_off

market_mood_shift must be copied from input core_data.market_mood.shift.
It must remain one of the following enum values:
- improving
- stable
- deteriorating
- unavailable

Do not translate market_mood_type, market_mood_bias, or market_mood_shift.

market_mood_label must be localized from input core_data.market_mood.label when available.
This is the primary user-facing mood headline.

Label rules:
- Localize naturally for each row language.
- Preserve the interpretive meaning of the source label.
- Do not replace the label with the raw type value such as "Mixed" or "Cautious".
- Do not mechanically append shift wording into the label.
- If label is missing, derive a concise label from type + bias using supported input evidence.

Useful label directions when deriving from type + bias:

Mixed + risk_on:
- Selective Risk Appetite
- Rotation-Driven Market
- Growth and Defense in Balance

Mixed + neutral:
- Directionless Mixed Trading
- Rotation-Driven Market

Mixed + risk_off:
- Mixed Market With a Defensive Tilt
- Fragile Market Balance

Cautious + risk_on:
- Cautious Risk Appetite
- Risk-On With Macro Friction

Cautious + neutral:
- Waiting for a Major Catalyst
- Fragile Market Balance

Cautious + risk_off:
- Defensive Wait-and-See
- Rising Defensive Pressure

These are examples, not mandatory mappings.

market_mood_shift_label must be a short localized display phrase for market_mood_shift.

SHIFT LABEL RULE:
Use these default localized phrases unless the row language clearly needs a more natural equivalent:

ko:
- improving: 위험선호 강화
- stable: 큰 변화 없음
- deteriorating: 경계 심화
- unavailable: ""

en:
- improving: Risk appetite strengthening
- stable: Little change
- deteriorating: Caution deepening
- unavailable: ""

ja:
- improving: リスク選好の強化
- stable: 大きな変化なし
- deteriorating: 警戒感の拡大
- unavailable: ""

When market_mood_shift is "unavailable", market_mood_shift_label must be an empty string.
Do not invent a prior-session comparison phrase.

market_mood_summary must be localized from input core_data.market_mood.summary when available.

The market_mood_summary must explain the overall tone of the day:
- what the market is doing today, not merely restating the label
- whether risk appetite is broad or selective
- whether macro conditions are supportive or restrictive
- whether investors appear optimistic, cautious, mixed, or defensive
- the internal tilt implied by market_mood_bias when supported by the input
- key drivers visible in the input such as AI, rates, energy, policy, geopolitics, or sector leadership

Bias-aware summary guidance:
- risk_on: risk appetite is present, even if selective, narrow, or restrained
- neutral: neither risk appetite nor defensive demand clearly dominates
- risk_off: defensive pressure or stress has greater influence than risk-taking

Shift-aware summary guidance:
- improving: overall risk appetite has strengthened versus the prior market context
- stable: the broader risk tone is broadly unchanged
- deteriorating: overall risk appetite has weakened versus the prior market context
- unavailable: do not mention a prior-session comparison or shift

market_mood_summary should complement, not duplicate, market_mood_label and market_mood_shift_label.
When shift is not unavailable, the summary may explain what changed, but the shift_label carries the compact day-over-day phrase.

If market_mood_type is Cautious:
- Do not make the tone sound broadly bullish.
- Emphasize selectivity, restraint, uncertainty, or risk awareness when supported by the input.

If market_mood_type is Risk-On:
- Do not ignore risks that are clearly present in the input.
- Explain whether the risk-on tone is broad or concentrated.

If market_mood_type is Risk-Off:
- Do not exaggerate panic unless the input explicitly supports it.
- Explain the main source of pressure.

If market_mood_type is Mixed:
- Preserve both sides of the signal.
- Do not force the summary into a bullish or bearish conclusion.

SIGNAL STRENGTH FALLBACK RULE:
If signal_strength is missing or not one of the allowed values:
- infer the closest allowed value only if clearly supported by the input
- otherwise use medium

MARKET MOOD FALLBACK RULE:
If market_mood.bias is missing or invalid:
- infer the closest allowed value only if clearly supported by the input and market_mood.type
- otherwise use neutral

If market_mood.shift is missing or invalid:
- use unavailable

TONE RULES:
1. Do not write direct investment advice.
2. Do not tell users to buy, sell, hold, overweight, underweight, enter, exit, hedge, or reduce exposure.
3. Avoid recommendation-like language.
4. Describe market interpretation, not investor instructions.
5. Avoid overconfident predictions.
6. Use probability-aware market language.
7. Avoid sensational wording unless the input explicitly supports it.
8. Do not exaggerate uncertainty either.
9. Keep the tone calm, analytical, and readable.
10. Prefer “may”, “could”, “suggests”, “points to”, “signals”, “keeps”, “limits”, “supports”, “weighs on”, “remains”, or equivalent natural expressions in each language.
11. Do not use extreme terms such as “crash”, “panic”, “collapse”, “explosion”, “guaranteed”, “certain”, or equivalent expressions unless directly supported by the input.

DASHBOARD COPY RULES:
The output should feel like a concise market dashboard, not a research note.

Guidelines:
- display_title: short headline
- display_subtitle: one compact sentence or sentence-like phrase
- core_summary: 2–4 concise sentences
- top_themes.theme_title: short card title
- top_themes.summary: one concise explanatory sentence
- market_mood_label: short interpretive headline
- market_mood_shift_label: short day-over-day phrase when shift is available
- market_mood_summary: 1–2 concise sentences

Avoid:
- overly long sentences
- excessive clauses
- academic phrasing
- bureaucratic phrasing
- mechanical translation
- vague summaries that do not explain the market tone
- language that sounds like a trading instruction

LANGUAGE STYLE RULES:

Korean:
- Use natural Korean market commentary.
- Prefer readable dashboard language over formal report language.
- Keep common market and technology terms in English when they are naturally used that way.
- Do not over-translate standard acronyms, company names, tickers, or product names.
- Avoid stiff bureaucratic phrasing.
- Avoid literal translation patterns.
- Avoid direct recommendation language such as “권고됩니다.”
- Prefer interpretive language such as:
  - “흐름입니다”
  - “분위기입니다”
  - “가능성이 있습니다”
  - “시사합니다”
  - “제한합니다”
  - “부각됩니다”
- Use “지정학 리스크” for geopolitical risk when applicable.
- Use “위험선호” or “Risk-On” naturally depending on context.
- Keep the writing clear and not overly dramatic.

English:
- Use clear institutional-style market commentary.
- Keep wording concise, balanced, and readable.
- Avoid direct recommendation language.
- Avoid overly promotional or sensational phrasing.
- Prefer dashboard-friendly expressions such as:
  - “points to”
  - “suggests”
  - “keeps investors selective”
  - “limits broad risk-taking”
  - “supports targeted exposure”
  - “weighs on sentiment”
  - “keeps the backdrop cautious”
- Preserve nuance when the input contains both supportive and restrictive signals.

Japanese:
- Use natural Japanese market commentary.
- Prefer concise, readable dashboard language.
- Avoid overly literal translation from English.
- Keep common market and technology terms in English when they are naturally used that way.
- Do not over-translate standard acronyms, company names, tickers, or product names.
- Prefer consistent explanatory style.
- Use “リスク選好” when referring to market risk appetite.
- Use “地政学リスク” for geopolitical risk when applicable.
- Avoid unnatural compound expressions.
- Avoid overly stiff or machine-translated phrasing.
- Preserve the direction of market signals carefully.
- Keep the writing calm, analytical, and not overly dramatic.

DATA PRESERVATION RULE:
Preserve all IDs and machine-readable arrays exactly as provided.

Do not alter:
- related_tags
- source_report_ids
- source_item_content_ids
- related_report_count
- signal_strength
- market_mood_type
- market_mood_bias
- market_mood_shift

Do not create new IDs.
Do not remove IDs.
Do not translate tags.
Do not localize machine-readable values.

ROBUSTNESS RULE:
The input may be incomplete or uneven.

If a source field is missing:
- Do not fail.
- Use the available supported information.
- Keep the output schema complete.
- Use empty arrays where appropriate.
- Use concise fallback wording only when necessary.

If a source field contains unclear wording:
- Preserve the safest supported interpretation.
- Do not invent clarification.
- Do not overstate.

If themes overlap:
- Keep them distinct if the input keeps them distinct.
- Avoid repeating the same sentence across themes.
- Make each theme’s role clear.

If the input contains risks:
- Integrate them naturally into core_summary or market_mood_summary.
- Do not create a separate risk section.
- Do not overemphasize risks beyond their role in the input.

QUALITY CHECK BEFORE OUTPUT:
Before finalizing, internally check:

JSON and structure:
- Is the output valid JSON?
- Is the top-level output a JSON object, not an array?
- Does the output contain exactly one key: i18n_rows?
- Are there exactly 3 rows?
- Are the rows exactly ko, en, ja?
- Does each row contain only the AI-generated columns?
- Are id, daily_market_memory_id, localization_status, source_lang_code, model_info, created_at, and updated_at excluded?

Localization:
- Are all user-facing fields written in the row language?
- Are top_themes.theme_title values localized for ko and ja?
- Are proper nouns, tickers, acronyms, and standard terms preserved where natural?
- Are machine-readable fields left unchanged?

Market meaning:
- Is the core interpretation preserved?
- Are all signal directions preserved accurately?
- Are mixed signals kept mixed?
- Is market_mood_type copied correctly?
- Are market_mood_bias and market_mood_shift copied correctly?
- Is market_mood_label localized and more informative than the raw type alone?
- Is market_mood_shift_label localized correctly and empty when shift is unavailable?
- Does market_mood_summary match market_mood_type, market_mood_bias, and market_mood_label?
- Does market_mood_summary avoid prior-session comparison when market_mood_shift is unavailable?
- Does the tone avoid unsupported bullishness or bearishness?
- Does the copy avoid direct investment advice?

Dashboard quality:
- Is the title concise?
- Is the subtitle suitable for a dashboard card?
- Is core_summary concise but informative?
- Are top theme summaries non-repetitive?
- Is the market mood explanation clear?
- Is the language natural for native readers?
- Is the output free of Markdown, comments, and explanations?

Return the final JSON only.

