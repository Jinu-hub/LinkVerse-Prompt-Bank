schema_path: schema.json
output_format: JSON

implementation:
  - Output must validate against schema.json.
  - Use the examples in examples/ as the canonical format.
  - Accept one Daily Market Memory core object (`core_data` required; `top_tags`, `top_entities`, `risk_signals` optional context).
  - The top-level JSON object must contain exactly one key: `i18n_rows`.
  - Generate exactly 3 i18n rows with `lang_code` values: ko, en, ja (in that order). No other languages.
  - This version does not support `output_lang`, `target_langs`, single-language regeneration, or partial retry.
  - Localize user-facing fields per row language: display_title, display_subtitle, core_summary, top_themes.theme_title, top_themes.summary, market_mood_label, market_mood_shift_label, market_mood_summary.
  - Copy machine-readable fields unchanged from input: signal_strength, related_tags, related_report_count, source_report_ids, source_item_content_ids, market_mood_type, market_mood_bias, market_mood_shift.
  - `market_mood_label` must be localized from `core_data.market_mood.label` and must not equal the raw type alone.
  - `market_mood_type` must be copied from `core_data.market_mood.type` (Risk-On | Risk-Off | Mixed | Cautious).
  - `market_mood_bias` must be copied from `core_data.market_mood.bias` (risk_on | neutral | risk_off).
  - `market_mood_shift` must be copied from `core_data.market_mood.shift` (improving | stable | deteriorating | unavailable).
  - `market_mood_shift_label` must follow SHIFT LABEL RULE in system.yaml; use empty string when shift is unavailable.
  - Preserve signal direction (rising/falling/tightening/easing/etc.); do not reverse mixed or uncertain inputs into one-sided statements.
  - Keep `top_themes` count equal to input when input has 3 or fewer; if input has more than 3, select the 3 most important and preserve order unless reordering clearly improves readability.
  - If `signal_strength` is missing or invalid, infer the closest value only when strongly supported by input; otherwise default to `medium`.
  - Integrate risks from input naturally into core_summary or market_mood_summary; do not add a separate risk section.
  - Write dashboard copy, not long-form reports; avoid investment advice and recommendation language.

format_rules:
  - Return only valid JSON; no markdown code fence, comments, or prose outside JSON.
  - Use UTF-8.
  - Top-level output must be a JSON object, not an array.
  - Do not include null values; use empty arrays when a list field is unavailable.
  - Do not output workflow/DB fields: id, daily_market_memory_id, localization_status, source_lang_code, model_info, created_at, updated_at.
  - Do not include Markdown headings, bullets, emojis, or formatting symbols in text fields.
  - display_title: short headline; display_subtitle: one compact phrase; core_summary: 2–4 sentences; top_themes.summary: one concise sentence; market_mood_summary: 1–2 sentences.

prohibitions:
  - Do not add fields not in the schema.
  - Do not invent facts, numbers, events, companies, policies, risks, or themes beyond input evidence.
  - Do not translate or alter related_tags, source_report_ids, source_item_content_ids, signal_strength, market_mood_type, market_mood_bias, or market_mood_shift.
  - Do not create new IDs or remove existing IDs.
  - Do not tell users to buy, sell, hold, overweight, underweight, enter, exit, hedge, or reduce exposure.
  - Do not use sensational terms (crash, panic, collapse, guaranteed, certain) unless explicitly supported by input.
  - Do not mechanically translate; rewrite naturally per language style rules in system.yaml.
