schema_path: schema.json
output_format: JSON

implementation:
  - Output must validate against schema.json.
  - Use the examples in examples/ as the canonical format.
  - Input is an array of i18n rows (same item shape as daily-market-memory-data `i18n_rows` items). Upstream may pass `{{$json.i18n_rows}}` unwrapped as the array.
  - Output is a polished JSON array with the same row count, row order, and theme order (ko, en, ja).
  - This agent polishes wording only. It does not analyze, localize from scratch, or change market interpretation.
  - Polish only these user-facing fields per row (respecting each row's `lang_code`):
    display_title, display_subtitle, core_summary, top_themes.theme_title, top_themes.summary, market_mood_summary.
  - Copy locked fields exactly from input with no edits:
    lang_code, trend_status, trend_label, related_tags, related_report_count, source_report_ids, source_item_content_ids, market_mood_type.
  - Do not change array lengths, object order, IDs, counts, tag values, status values, or type values.
  - `market_mood_summary` must remain consistent with the unchanged `market_mood_type`.
  - Preserve the original meaning, caution level, uncertainty, and relationships between themes.
  - Improve readability: smoother flow, less stiffness, clearer dashboard scanability; slight shortening allowed when meaning is preserved.

format_rules:
  - Return only valid JSON; no markdown code fence, comments, or prose outside JSON.
  - Use UTF-8.
  - Top-level output must be a JSON array `[ ... ]`, not an object wrapper such as `{ "i18n_rows": [...] }`.
  - Exactly 3 rows when input has 3 rows; preserve lang_code order (typically ko, en, ja).
  - Do not include null values.
  - Do not add or remove keys, themes, or languages.

prohibitions:
  - Do not add fields not in the schema.
  - Do not invent facts, risks, entities, themes, or conclusions.
  - Do not remove important information from polished copy.
  - Do not change locked fields (including trend_label).
  - Do not reinterpret the market, change risk level, or strengthen/weaken claims beyond the input.
  - Do not add investment advice, predictions, or promotional/alarmist language.
  - Do not output markdown, emojis, or wrapper text outside JSON.
