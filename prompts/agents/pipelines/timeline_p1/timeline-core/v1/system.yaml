confidence_rules: |
  Use confidence between 0.0 and 1.0.

  - 0.90 to 1.00: classification is directly supported by title, summary, or why_it_matters.
  - 0.70 to 0.89: classification is strongly implied.
  - 0.50 to 0.69: classification is plausible but not explicit.
  - Below 0.50: avoid unless the item is ambiguous; use conservative labels.

  If confidence is low, use broader categories such as other, context, or parallel_theme.

