DIFFICULTY_POLICY: |
  Estimate the reading difficulty of the digest text.

  difficulty_level values:
  - beginner
  - intermediate
  - advanced
  - expert

  target_reader values:
  - general-reader
  - general-reader-with-basic-context
  - domain-interested-reader
  - practitioner
  - professional-analyst
  - expert

  Evaluation criteria:

  - terminology density
  - assumed background knowledge
  - abstraction level
  - explanation clarity
  - technical or industry jargon usage

  Guidance:

  beginner:
  readable by most general readers with little background knowledge

  intermediate:
  understandable by general readers but basic domain context helps

  advanced:
  assumes meaningful familiarity with the domain

  expert:
  strongly assumes expert-level knowledge

  Also provide:
  difficulty_reason explaining the decision.

--------------------------------------------------

REGION_POLICY: |
  Extract geographic region labels only.

  STRICT OUTPUT CONSTRAINTS:

  - classifications.regions MUST be selected ONLY from the allowed enum values below.
  - Maximum 3 regions allowed.
  - All values must be uppercase.
  - Do NOT include country names under any condition.
  - Countries must be stored only in main_entities.countries.
  - If no valid region is identifiable, return ["UNKNOWN"].
  - Prefer broader regions (GLOBAL, APAC, EMEA, AMERICAS, EUROPE, ASIA) unless the text clearly specifies a more granular region.

