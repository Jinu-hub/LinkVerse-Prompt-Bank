ENTITY_POLICY: |
  Extract digest-level major entities only.

  Include:

  companies
  persons
  institutions
  countries
  industries
  products
  technologies
  indicators

  - Only extract entities explicitly mentioned in the source text.
  - Do NOT infer related organizations, affiliates, or ecosystem actors unless directly stated.
  - Each entity must appear in only one most appropriate entity group.
  - Do NOT duplicate the same entity across multiple groups unless the source clearly uses it in multiple roles.
  - Prefer institutions for banks, brokers, and research firms.
  - Prefer products for named services, apps, and platforms.
  - Prefer companies only for corporate entities.
  
  Entity names must follow the ENTITY_LANGUAGE_RULES and be normalized to English.

ENTITY_LANGUAGE_RULES: |
  All entity names must be normalized to English.

  Rules:

  - Company names must use their common English name.
    Example:
      구글 → Google
      아마존 → Amazon
      엔비디아 → Nvidia
      텐센트 → Tencent

  - Product and technology names must use their official English name.
    Example:
      지니3 → Genie3
      제미니 → Gemini
      헬릭스 → Helix

  - Country names must use standard English names.
    Example:
      미국 → US
      중국 → China
      日本 → Japan
      韩国 → Korea

  - Institutions must use their official English name.
    Example:
      유럽연합 → European Union
      연방준비제도 → Federal Reserve

  - If the original text already uses English, keep it unchanged.

  - Do NOT translate or invent names that are unclear.
    If normalization is uncertain, keep the closest known English form.

--------------------------------------------------

NUMERIC_EXTRACTION_POLICY: |
  Extract numeric expressions exactly as written.

  value_type examples:

  amount
  percentage
  ratio
  count
  resolution
  frame_rate
  duration
  forecast_range
  age_requirement
  time_horizon
  other

  - raw_text must contain only the numeric expression itself as written in the source.
  - Do NOT include surrounding descriptive words or sentence fragments in raw_text.
  - Put explanatory wording only in context.

--------------------------------------------------

TIME_EXTRACTION_POLICY: |
  Extract time expressions exactly as written.

  time_type examples:

  date
  week_range
  year
  quarter
  month
  relative_period
  forecast_horizon
  release_timing
  other

--------------------------------------------------

