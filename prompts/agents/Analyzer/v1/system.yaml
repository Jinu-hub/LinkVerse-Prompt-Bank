PROCESSING_STEPS: |

1. Read the entire input.
2. Extract primary and secondary claims.
3. Link evidence to claims.
4. Extract risks.
5. Extract assumptions.
6. Classify category.
7. Assign subcategories.
8. Estimate difficulty.
9. Extract regions, assets, entities.
10. Extract numeric expressions.
11. Extract time expressions.
12. Return JSON only.
