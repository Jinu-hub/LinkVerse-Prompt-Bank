REGION_POLICY: |
  Extract regions/countries explicitly mentioned or strongly implied.
  Use normalized values when possible:
  - US
  - CHINA
  - JAPAN
  - KOREA
  - EUROPE
  - GLOBAL
  - UNKNOWN

ASSET_CLASS_POLICY: |
  Assign only digest-level asset classes when clearly relevant.
  Possible values:
  - equity
  - crypto
  - fx
  - rates
  - bonds
  - commodities
  - private-market
  - venture
  - ai-infra
  - none

ENTITY_POLICY: |
  Extract digest-level major entities only (object-level entity identification).
  Include:

  - companies: Company names (기업명).
  - persons: Named individuals, executives, analysts, public figures (인물).
  - institutions: Organizations, agencies, central banks, exchanges (기관).
  - countries: Countries and regions explicitly mentioned (국가 / 지역). Use normalized values when possible (see REGION_POLICY).
  - industries: Sectors or industry groups the digest focuses on (산업군). e.g. semiconductor, fintech, energy.
  - asset_classes: Digest-level asset classes when clearly relevant (자산군). Use ASSET_CLASS_POLICY values; keep at digest level only.
  - products: Product names, service names (제품·서비스명).
  - technologies: Technologies, models, standards (기술·모델명).
  - indicators: Named indices, metrics, economic or market indicators (지표명). e.g. VIX, PMI, CPI, specific index names.

NUMERIC_EXTRACTION_POLICY: |
  Extract numeric expressions exactly as written.

  value_type examples:
  - amount
  - percentage
  - ratio
  - count
  - resolution
  - frame_rate
  - duration
  - forecast_range
  - age_requirement
  - time_horizon
  - other

TIME_EXTRACTION_POLICY: |
  Extract time expressions exactly as written.

  time_type examples:
  - date
  - week_range
  - year
  - quarter
  - month
  - relative_period
  - forecast_horizon
  - release_timing
  - other

OUTPUT_REQUIREMENTS: |
  Output valid JSON only.

  Top-level fields:
  - input_date
  - topic
  - classifications

OUTPUT_SCHEMA: |
  {
    "input_date": "string",
    "topic": "string",
    "classifications": {
      "category": "string or null",
      "subcategories": ["string"],
      "regions": ["string"],
      "asset_classes": ["string"],
      "main_entities": {
        "companies": ["string"],
        "persons": ["string"],
        "institutions": ["string"],
        "countries": ["string"],
        "industries": ["string"],
        "products": ["string"],
        "technologies": ["string"],
        "indicators": ["string"]
      },
      "numeric_data": [
        {
          "raw_text": "string",
          "value_type": "string",
          "context": "string"
        }
      ],
      "time_data": [
        {
          "raw_text": "string",
          "time_type": "string",
          "context": "string"
        }
      ],
      "confidence_note": "string or null"
    }
  }

PROCESSING_STEPS: |
  1. Read the entire digest input.
  2. Determine the single best official category for the digest.
  3. Assign up to 5 subcategories for the digest.
  4. Extract digest-level regions, asset classes, and major entities.
  5. Extract raw numeric expressions exactly as written.
  6. Extract raw time expressions exactly as written.
  7. Return only structured JSON.

INPUT_DATA: |
  reference user_template.md for input data
