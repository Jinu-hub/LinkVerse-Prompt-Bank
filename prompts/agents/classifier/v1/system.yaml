DIFFICULTY_POLICY: |
  Estimate the reading difficulty of the digest text.

  difficulty_level values:
  - beginner
  - intermediate
  - advanced
  - expert

  target_reader values:
  - general-reader
  - general-reader-with-basic-context
  - domain-interested-reader
  - practitioner
  - professional-analyst
  - expert

  Evaluation criteria:

  - terminology density
  - assumed background knowledge
  - abstraction level
  - explanation clarity
  - technical or industry jargon usage

  Guidance:

  beginner:
  readable by most general readers with little background knowledge

  intermediate:
  understandable by general readers but basic domain context helps

  advanced:
  assumes meaningful familiarity with the domain

  expert:
  strongly assumes expert-level knowledge

  Also provide:
  difficulty_reason explaining the decision.

